
<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bazar App - Pi Sign-In</title>
</head>
<body>
  <h2>Bazar App</h2>
  <p id="status">Pi Sign-In যাচাই করা হচ্ছে...</p>

  <script>
    const status = document.getElementById("status");

    async function handlePiSignIn() {
      const params = new URLSearchParams(
        window.location.hash.substring(1)
      );

      const token = params.get("access_token");
      const returnedState = params.get("state");
      const savedState = sessionStorage.getItem("pi_oauth_state");
      const error = params.get("error");

      if (error) {
        status.textContent =
          "Pi Sign-In সম্পন্ন হয়নি। আবার চেষ্টা করুন।";
        history.replaceState(null, "", window.location.pathname);
        sessionStorage.removeItem("pi_oauth_state");
        return;
      }

      if (!token || !returnedState || !savedState ||
          returnedState !== savedState) {
        status.textContent =
          "Sign-In যাচাই করা যায়নি। Bazar App থেকে আবার চেষ্টা করুন।";
        return;
      }

      try {
        status.textContent = "Pi অ্যাকাউন্ট যাচাই করা হচ্ছে...";

        const response = await fetch(
          "https://api.minepi.com/v2/me",
          {
            method: "GET",
            headers: {
              "Authorization": "Bearer " + token
            }
          }
        );

        if (!response.ok) {
          throw new Error("Pi account verification failed");
        }

        const user = await response.json();

        status.textContent =
          "স্বাগতম, " + (user.username || "Pi ব্যবহারকারী") +
          "! Pi Sign-In সফল হয়েছে।";

        sessionStorage.setItem(
          "pi_username",
          user.username || ""
        );

      } catch (err) {
        status.textContent =
          "Pi অ্যাকাউন্ট যাচাই করা যায়নি। পরে আবার চেষ্টা করুন।";
      } finally {
        sessionStorage.removeItem("pi_oauth_state");
        history.replaceState(null, "", window.location.pathname);
      }
    }

    handlePiSignIn();
  </script>
</body>
</html>
